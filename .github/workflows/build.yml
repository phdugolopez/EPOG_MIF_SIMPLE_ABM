name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: One run at the defaults
        if: hashFiles('run.py') != ''
        run: python run.py
